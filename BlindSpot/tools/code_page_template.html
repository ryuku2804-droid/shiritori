<title>BLIND SPOT ソースコード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* レイアウト: ファイル名のチップ → ファイルごとに 見出し・パス・コピー・コード を縦に並べるだけ */
:root {
  --bg: #eef0ee;
  --surface: #ffffff;
  --fg: #1a1f1e;
  --muted: #5b6562;
  --line: #d5dad7;
  --accent: #1d6f6d;
  --accent-soft: #d8ebe9;
  --alt-bg: #f5f6f4;
  --new-fg: #1d6b3a;
  --new-bg: #dcefe2;
  --chg-fg: #8a5a00;
  --chg-bg: #f6e8c8;
  --code-bg: #14191a;
  --code-fg: #d9e0dd;
  --code-gutter: #5f6b68;
  --code-line: #ffffff14;
  --tok-comment: #7d958f;
  --tok-string: #d9b77a;
  --tok-keyword: #7fc6d6;
  --tok-number: #c9a0dc;
  --tok-pre: #e08a7a;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "Consolas", "Menlo", "MS Gothic", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101413; --surface: #181e1d; --fg: #e3e8e6; --muted: #95a29e; --line: #2b3432;
    --accent: #5fbdb8; --accent-soft: #1d3332; --alt-bg: #141a19;
    --new-fg: #8fdca8; --new-bg: #1b3524; --chg-fg: #f0c46a; --chg-bg: #3a2e12;
    --code-bg: #0b0f0f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101413; --surface: #181e1d; --fg: #e3e8e6; --muted: #95a29e; --line: #2b3432;
  --accent: #5fbdb8; --accent-soft: #1d3332; --alt-bg: #141a19;
  --new-fg: #8fdca8; --new-bg: #1b3524; --chg-fg: #f0c46a; --chg-bg: #3a2e12;
  --code-bg: #0b0f0f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 64px; display: grid; gap: 24px; }
header { display: grid; gap: 6px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .16em; color: var(--accent); font-weight: 600; }
h1 { margin: 0; font-size: 24px; line-height: 1.35; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }

.badge { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: 4px; letter-spacing: .05em; white-space: nowrap; font-family: var(--font-body); }
.badge.new { color: var(--new-fg); background: var(--new-bg); }
.badge.chg { color: var(--chg-fg); background: var(--chg-bg); }
.badge.same { color: var(--muted); background: var(--alt-bg); border: 1px solid var(--line); }

nav.chips { display: flex; flex-wrap: wrap; gap: 8px; }
nav.chips a { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--accent); text-decoration: none; font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; }
nav.chips a .ord { color: var(--muted); font-variant-numeric: tabular-nums; }
nav.chips a:hover { border-color: var(--accent); background: var(--accent-soft); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section.file { display: grid; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); scroll-margin-top: 16px; }
.file-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
.file-meta { display: grid; gap: 2px; min-width: 0; flex: 1 1 360px; }
h2 { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 20px; font-weight: 600; overflow-wrap: anywhere; }
h2 .ord { color: var(--muted); font-weight: 500; }
.path { font-family: var(--font-mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.path .lines { margin-left: 12px; font-variant-numeric: tabular-nums; }
.desc { margin: 0; font-size: 14px; }
button.copy { flex: 0 0 auto; min-width: 128px; padding: 10px 18px; border: 0; border-radius: 6px; cursor: pointer; background: var(--accent); color: var(--surface); font: 600 15px/1 var(--font-body); }
button.copy:hover { filter: brightness(1.08); }
button.copy.done { background: var(--new-fg); }

.code { display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--code-bg); color: var(--code-fg); border-radius: 8px; max-height: 70vh; overflow: auto; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; }
.code pre { margin: 0; padding: 14px 16px; white-space: pre; tab-size: 4; }
.code .gutter { color: var(--code-gutter); text-align: right; user-select: none; padding-right: 10px; border-right: 1px solid var(--code-line); font-variant-numeric: tabular-nums; position: sticky; left: 0; background: var(--code-bg); }
.t-c { color: var(--tok-comment); font-style: italic; }
.t-s { color: var(--tok-string); }
.t-k { color: var(--tok-keyword); }
.t-n { color: var(--tok-number); }
.t-p { color: var(--tok-pre); }

@media (max-width: 560px) {
  h1 { font-size: 21px; }
  button.copy { width: 100%; }
  .code { font-size: 12px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">BLIND SPOT / SOURCE</div>
    <h1>{{STEP_TITLE}}</h1>
    <p class="lead">コードだけを載せています。置き方・アタッチ先・解説はチャットを見てください。</p>
    <div class="counts">{{COUNTS}}</div>
  </header>
  <nav class="chips" id="chips" aria-label="ファイル一覧"></nav>
  <main id="files" style="display:grid;gap:24px"></main>
</div>

<script id="data" type="application/json">{{DATA}}</script>
<script>
(function () {
  const files = JSON.parse(document.getElementById('data').textContent);

  const KEYWORDS = new Set(('abstract as base bool break byte case catch char class const continue decimal default delegate do double else enum event explicit extern false finally fixed float for foreach get set goto if implicit in int interface internal is lock long namespace new null object operator out override params private protected public readonly ref return sbyte sealed short sizeof static string struct switch this throw true try typeof uint ulong unchecked unsafe ushort using var virtual void volatile while yield async await nameof value when where').split(' '));
  const TOKEN = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(\$?@?"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])')|(^[ \t]*#[^\n]*)|\b(\d+(?:\.\d+)?f?)\b|\b([A-Za-z_]\w*)\b/gm;

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function highlight(src) {
    let out = '', last = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(src))) {
      out += esc(src.slice(last, m.index));
      const t = m[0];
      if (m[1]) out += '<span class="t-c">' + esc(t) + '</span>';
      else if (m[2]) out += '<span class="t-s">' + esc(t) + '</span>';
      else if (m[3]) out += '<span class="t-p">' + esc(t) + '</span>';
      else if (m[4]) out += '<span class="t-n">' + esc(t) + '</span>';
      else if (KEYWORDS.has(t)) out += '<span class="t-k">' + t + '</span>';
      else out += esc(t);
      last = TOKEN.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  function anchorOf(name) { return name.replace(/\.[^.]+$/, '').replace(/[^A-Za-z0-9_-]/g, ''); }
  function badgeOf(f) { return '<span class="badge ' + ({ '変更': 'chg', '新規': 'new' }[f.status] || 'same') + '">' + esc(f.status) + '</span>'; }

  async function copyText(text, btn, codeEl) {
    try {
      await navigator.clipboard.writeText(text);
      flash(btn, 'コピーしました');
    } catch (e) {
      const range = document.createRange();
      range.selectNodeContents(codeEl);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      flash(btn, 'Ctrl+C でコピー');
    }
  }
  function flash(btn, label) {
    btn.textContent = label;
    btn.classList.add('done');
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('done'); }, 1800);
  }

  const chips = document.getElementById('chips');
  const main = document.getElementById('files');
  files.forEach((f, i) => {
    const id = anchorOf(f.name);
    const ord = String(i + 1);
    chips.insertAdjacentHTML('beforeend', '<a href="#' + id + '"><span class="ord">' + ord + '</span>' + esc(f.name) + ' ' + badgeOf(f) + '</a>');

    const code = f.code.replace(/\n$/, '');
    const lineCount = code.split('\n').length;
    const sec = document.createElement('section');
    sec.className = 'file';
    sec.id = id;
    sec.innerHTML =
      '<div class="file-head"><div class="file-meta">' +
        '<h2><span class="ord">' + ord + '.</span>' + esc(f.name) + ' ' + badgeOf(f) + '</h2>' +
        '<div class="path">' + esc(f.path) + '<span class="lines">' + f.lines + ' 行</span></div>' +
        '<p class="desc">' + esc(f.desc) + '</p>' +
      '</div><button class="copy" type="button" id="copy-' + id + '">コピー</button></div>' +
      '<div class="code" tabindex="0" aria-label="' + esc(f.name) + ' のソースコード">' +
        '<pre class="gutter" aria-hidden="true">' + Array.from({ length: lineCount }, (_, k) => k + 1).join('\n') + '</pre>' +
        '<pre><code>' + highlight(code) + '</code></pre>' +
      '</div>';
    main.appendChild(sec);
    const codeEl = sec.querySelector('.code pre:last-child code');
    sec.querySelector('button.copy').addEventListener('click', () => copyText(f.code, sec.querySelector('button.copy'), codeEl));
  });
})();
</script>
